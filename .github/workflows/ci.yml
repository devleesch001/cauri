# Tests and lint on every push and pull request; on main and on v* tags,
# the image is built and pushed to GitHub Container Registry (ghcr.io),
# and on v* tags a GitHub release is published with GoReleaser.
#
# Actions use their major version tag (vN), so that fixes released within
# a major version apply without changing this file.
#
# Jobs run on GitHub-hosted "ubuntu-latest" runners. Each job only gets the
# permissions it needs: the default is read-only.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Test (SQLite)
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0 # at least: older versions cannot read Go 1.27.2 packages

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # type-checks, then builds

  image:
    if: github.event_name == 'push'
    needs: [go, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: image
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          # Stable vX.Y.Z: X.Y.Z, X.Y, X (not while X is 0: every 0.Y may
          # break) and latest. Pre-release vX.Y.Z-*: only its exact version,
          # and next. Branch: main and sha-*.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=next,enable=${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
            type=ref,event=branch
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
          flavor: |
            latest=false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown by "cauri version" (internal/version): the release tag or
          # dev, and the commit.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [go, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
