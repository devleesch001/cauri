# Tests and lint on every push and pull request; on main and on v* tags,
# the image is also built and pushed to the container registry of this
# Forgejo instance, as <instance host>/<owner>/<repository>.
#
# Settings of the repository (Settings > Actions):
#   secret REGISTRY_TOKEN  access token allowed to write packages
#   var    REGISTRY_USER   its user (defaults to the user who pushed)
#
# Actions are pinned to commit SHAs (tag in comment): the image job hands
# the registry token to them, and a tag can be moved. Update the pins
# deliberately, for example with Renovate.
#
# "runs-on: docker" is the default label of the Forgejo runner: change it
# to match your runner. The image job needs a runner whose job
# containers can reach a Docker daemon (for example the host socket).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go:
    runs-on: docker
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
    env:
      CAURI_TEST_PG_DSN: postgres://postgres:test@postgres:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Test (SQLite and PostgreSQL)
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

  ui:
    runs-on: docker
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # type-checks, then builds

  image:
    if: github.event_name == 'push'
    needs: [go, ui]
    runs-on: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image name and tags
        id: meta
        run: |
          host="${GITHUB_SERVER_URL#*://}"
          image="$(echo "${host%/}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
            tags="${image}:${version},${image}:latest"
          else
            version="${GITHUB_SHA::12}"
            tags="${image}:main,${image}:sha-${version}"
          fi
          echo "registry=${host%/}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
