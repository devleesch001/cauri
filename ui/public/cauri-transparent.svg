<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>cauri</title>
  <style>
    .ink { fill: #1c1917 }
    .accent { fill: #f97316 }
    .line { fill: none; stroke: #f97316; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) { .ink { fill: #fafaf9 } }
  </style>
  <!-- The screen and two buttons are holes in the frame: the background shows through. -->
  <mask id="cauri-window">
    <rect width="64" height="64" fill="#fff"/>
    <rect x="7" y="15" width="50" height="40" rx="4"/>
    <circle cx="16.5" cy="10" r="2"/>
    <circle cx="22.5" cy="10" r="2"/>
  </mask>
  <g id="window">
    <rect class="ink" x="3" y="5" width="58" height="54" rx="8" mask="url(#cauri-window)"/>
    <circle class="accent" cx="10.5" cy="10" r="2"/>
  </g>
  <!-- Cowrie's shell: the body with its wavy band cut out, then the aperture. -->
  <g id="shell" class="ink">
