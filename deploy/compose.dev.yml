# Development services: a real Cowrie honeypot writing into ./data/cowrie,
# read by an ingestor run from the source tree. See docs/development.md.
#
#   docker compose -f deploy/compose.dev.yml up -d cowrie

name: cauri-dev

services:
  cowrie:
    image: cowrie/cowrie:latest
    # Run as the developer, so that the files written in ./data/cowrie are
    # yours. Cowrie does not create its log and tty directories: create
    # them first, see docs/development.md.
    user: "${DEV_UID:-999}:${DEV_GID:-999}"
    volumes:
      - ../data/cowrie:/cowrie/cowrie-git/var
    ports:
      - "127.0.0.1:${COWRIE_DEV_PORT:-22222}:2222"
