# Mode 2: one container for the API and the UI ("api --ui"), one for the
# ingestor. Traefik sends the whole domain to the first.
#
#   docker compose -f compose.api-ui.yml --env-file .env up -d
#
# See ../README.md for the first start (token creation) and for
# protecting the UI, which has no authentication of its own yet.

name: cauri

services:
  api:
    image: ${CAURI_IMAGE:?set CAURI_IMAGE}
    command: ["api", "--ui"]
    restart: unless-stopped
    environment:
      CAURI_DB_DRIVER: ${CAURI_DB_DRIVER:-sqlite}
      CAURI_DB_DSN: ${CAURI_DB_DSN:-/data/cauri.db}
      # Optional GeoIP database, in the cauri-data volume (README: GeoIP).
      CAURI_GEOIP_DB: ${CAURI_GEOIP_DB:-}
      CAURI_GEOIP_ASN_DB: ${CAURI_GEOIP_ASN_DB:-}
    volumes:
      - cauri-data:/data
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
      # Ingestion: token-authenticated by cauri itself.
      traefik.http.routers.cauri-ingest.rule: Host(`${CAURI_DOMAIN:?set CAURI_DOMAIN}`) && PathPrefix(`/api/ingest`)
      traefik.http.routers.cauri-ingest.entrypoints: ${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT}
      traefik.http.routers.cauri-ingest.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER}
      traefik.http.routers.cauri-ingest.service: cauri
      # UI and read API: put your protection here.
      traefik.http.routers.cauri.rule: Host(`${CAURI_DOMAIN}`)
      traefik.http.routers.cauri.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.cauri.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.routers.cauri.service: cauri
      traefik.http.services.cauri.loadbalancer.server.port: "8080"

  ingestor:
    image: ${CAURI_IMAGE}
    command: ["ingestor"]
    restart: unless-stopped
    environment:
      CAURI_API_URL: ${CAURI_INGEST_API_URL:-http://api:8080}
      CAURI_SENSOR_ID: ${CAURI_SENSOR_ID:?set CAURI_SENSOR_ID}
      CAURI_TOKEN_FILE: /run/secrets/cauri_token
      CAURI_COWRIE_LOG_DIR: /cowrie/var/log/cowrie
      CAURI_COWRIE_TTY_DIR: /cowrie/var/lib/cowrie/tty
    volumes:
      - ${COWRIE_VAR_DIR:?set COWRIE_VAR_DIR}:/cowrie/var:ro
      - cauri-ingestor:/data
    secrets: [cauri_token]
    depends_on: [api]

secrets:
  cauri_token:
    file: ${CAURI_TOKEN_FILE:?set CAURI_TOKEN_FILE}

volumes:
  cauri-data:
  cauri-ingestor:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
